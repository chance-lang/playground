<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c4b18a">
  <title>Monster Truck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section class="stage" aria-label="Monster truck">
      <div class="hud">
        <p class="score">Score <strong id="score">0</strong></p>
        <div class="tires" id="tires" aria-label="4 wheels left">
          <span class="tire-icon" title="Back right"></span>
          <span class="tire-icon" title="Back left"></span>
          <span class="tire-icon" title="Front right"></span>
          <span class="tire-icon" title="Front left"></span>
        </div>
      </div>
      <div class="prompt-stack">
        <button type="button" id="replay" class="speaker replay-sound" aria-label="Replay the letter, number, or word" disabled>
          <img src="img/replay-sound.png" alt="" draggable="false">
        </button>
        <div class="dice-prompt" id="dicePrompt" hidden aria-hidden="true">
          <div class="die" id="dieA" data-face="1"></div>
          <span class="dice-plus" aria-hidden="true">+</span>
          <div class="die" id="dieB" data-face="1"></div>
          <span class="dice-plus dice-op-extra" id="diceOpC" hidden aria-hidden="true">+</span>
          <div class="die" id="dieC" data-face="1" hidden></div>
        </div>
      </div>

      <div class="arena" aria-hidden="true">
        <div class="arena-track" id="arenaTrack">
          <div class="arena-panel"></div>
          <div class="arena-panel"></div>
        </div>
      </div>

      <div class="road" id="road">
        <div class="ramp" aria-hidden="true">
          <img src="img/derby-ramp.png" alt="">
        </div>
        <div class="barricade" aria-hidden="true">
          <img src="img/derby-barricade.png" alt="">
        </div>
        <div class="truck-anchor">
          <div class="crash-fx" id="crashFx" aria-hidden="true"></div>
          <div class="truck-rig driving" id="truckRig">
            <div class="truck-pose" id="truckPose">
              <div id="truckMount" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="play" aria-label="Choices">
      <p id="prompt" class="sr-only"></p>
      <div class="choices" id="choices"></div>
    </section>

    <div id="start" class="overlay">
      <p class="eyebrow">Listen, then tap</p>
      <h1>Monster Truck</h1>
      <p class="blurb">A letter, number, or sight word is spoken. Tap the one you hear. A miss knocks off a wheel.</p>
      <div class="pool-toggles" role="group" aria-label="What to practice">
        <label class="pool-toggle">
          <span>A–Z</span>
          <input type="checkbox" data-pool="letters" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>a–z</span>
          <input type="checkbox" data-pool="lower">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>0–9</span>
          <input type="checkbox" data-pool="digits" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>10–20</span>
          <input type="checkbox" data-pool="teens">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>Sight Words</span>
          <input type="checkbox" data-pool="sight">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>Small Words</span>
          <input type="checkbox" data-pool="words">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>2 Dice Addition</span>
          <input type="checkbox" data-pool="dice2">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>3 Dice Addition</span>
          <input type="checkbox" data-pool="dice3">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>3 Dice Subtraction</span>
          <input type="checkbox" data-pool="dice3sub">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
      <button type="button" id="startBtn" class="overlay-btn">Tap to start</button>
    </div>

    <div id="gameover" class="overlay" hidden>
      <p class="eyebrow">The truck can't roll</p>
      <h2>Out of wheels</h2>
      <p class="blurb">Score <strong id="finalScore">0</strong></p>
      <div class="pool-toggles" role="group" aria-label="What to practice">
        <label class="pool-toggle">
          <span>A–Z</span>
          <input type="checkbox" data-pool="letters" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>a–z</span>
          <input type="checkbox" data-pool="lower">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>0–9</span>
          <input type="checkbox" data-pool="digits" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>10–20</span>
          <input type="checkbox" data-pool="teens">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>Sight Words</span>
          <input type="checkbox" data-pool="sight">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>Small Words</span>
          <input type="checkbox" data-pool="words">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>2 Dice Addition</span>
          <input type="checkbox" data-pool="dice2">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>3 Dice Addition</span>
          <input type="checkbox" data-pool="dice3">
          <span class="switch" aria-hidden="true"></span>
        </label>
        <label class="pool-toggle">
          <span>3 Dice Subtraction</span>
          <input type="checkbox" data-pool="dice3sub">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
      <button type="button" id="again" class="overlay-btn">Play again</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
