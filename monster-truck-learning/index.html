<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8ecaff">
  <title>Monster Truck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section class="stage" aria-label="Monster truck">
      <div class="hud">
        <p class="score">Score <strong id="score">0</strong></p>
        <div class="tires" id="tires" aria-label="4 wheels left">
          <span class="tire-icon" title="Back right"></span>
          <span class="tire-icon" title="Back left"></span>
          <span class="tire-icon" title="Front right"></span>
          <span class="tire-icon" title="Front left"></span>
        </div>
        <button type="button" id="replay" class="speaker" aria-label="Hear the letter or number again" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3z"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 010 6M18.5 7a7 7 0 010 10"/>
          </svg>
        </button>
      </div>

      <div class="sky">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
      </div>

      <div class="road" id="road">
        <div class="lanes"></div>
        <div class="ramp" aria-hidden="true"></div>
        <div class="truck-anchor">
          <div class="truck-rig driving" id="truckRig">
            <svg id="truck" class="truck" viewBox="0 0 480 260" aria-hidden="true">
              <defs>
                <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
                  <rect width="14" height="14" fill="#ffe14a"/>
                  <rect width="7" height="14" fill="#111"/>
                </pattern>
                <pattern id="mesh" width="6" height="6" patternUnits="userSpaceOnUse">
                  <path d="M0 6 L6 0 M-1 1 L1 -1 M5 7 L7 5" stroke="#6b1010" stroke-width="1.2"/>
                </pattern>
              </defs>

              <ellipse class="shadow" cx="250" cy="242" rx="160" ry="12"/>

              <g class="wheel rear left" id="wheel-bl">
                <circle class="tire" cx="120" cy="150" r="36"/>
                <circle class="sidewall" cx="120" cy="150" r="27"/>
                <g class="spin">
                  <circle class="rim rear-rim" cx="120" cy="150" r="15"/>
                  <path class="spokes" d="M120 137 v26 M107 150 h26 M110.8 140.8 l18.4 18.4 M129.2 140.8 l-18.4 18.4"/>
                  <circle class="hub" cx="120" cy="150" r="4.5"/>
                </g>
              </g>
              <g class="wheel front left" id="wheel-fl">
                <circle class="tire" cx="328" cy="150" r="36"/>
                <circle class="sidewall" cx="328" cy="150" r="27"/>
                <g class="spin">
                  <circle class="rim front-rim" cx="328" cy="150" r="15"/>
                  <path class="spokes" d="M328 137 v26 M315 150 h26 M318.8 140.8 l18.4 18.4 M337.2 140.8 l-18.4 18.4"/>
                  <circle class="hub" cx="328" cy="150" r="4.5"/>
                </g>
              </g>

              <g class="chassis">
                <path class="shock rear-shock" d="M132 186 v-42 M164 186 v-42"/>
                <path class="shock front-shock" d="M316 186 v-42 M348 186 v-42"/>
                <path class="axle" d="M120 150 h48 M304 150 h48"/>
                <rect class="frame" x="108" y="142" width="260" height="14" rx="5"/>
              </g>

              <g class="body">
                <path class="shell" d="M104 152
                  L112 78
                  H220
                  L232 58
                  H336
                  L372 108
                  H380
                  V152
                  Z"/>
                <path class="hood" d="M268 78 H336 L368 118 H268 Z"/>
                <rect class="hood-stripe" x="312" y="80" width="44" height="36" fill="url(#hazard)" opacity="0.95"/>
                <path class="window" d="M240 68 H320 L338 110 H230 Z"/>
                <path class="cage" d="M236 148 v-78 h96 v78 M236 70 h96 M258 70 v78 M308 70 v78 M236 104 h96"/>
                <rect class="grille" x="368" y="110" width="18" height="32" fill="url(#mesh)"/>
                <rect class="bumper" x="362" y="132" width="26" height="12" rx="2"/>

                <g class="graffiti">
                  <circle class="x-badge" cx="162" cy="108" r="32"/>
                  <path class="x-mark" d="M148 94 l28 28 M176 94 l-28 28 M152 94 l28 28 M172 94 l-28 28"/>
                  <rect class="number-plate" x="198" y="92" width="52" height="38" rx="3"/>
                  <text class="number-68" x="224" y="121" text-anchor="middle">68</text>
                  <g class="skull" transform="translate(286 92)">
                    <ellipse class="cranium" cx="12" cy="10" rx="11" ry="9"/>
                    <path class="jaw" d="M5 16 h14 v6 H5z"/>
                    <circle class="socket" cx="7.5" cy="9" r="2.4"/>
                    <circle class="socket" cx="16.5" cy="9" r="2.4"/>
                    <path class="bones" d="M-2 22 l10 -6 10 6 M-2 26 l10 -6 10 6"/>
                  </g>
                </g>
              </g>

              <g class="wheel rear right" id="wheel-br">
                <circle class="tire" cx="152" cy="188" r="54"/>
                <circle class="sidewall" cx="152" cy="188" r="41"/>
                <path class="tire-mark rear-mark" d="M120 168 q16 10 12 26 q20 -6 32 10"/>
                <g class="spin">
                  <circle class="rim rear-rim" cx="152" cy="188" r="22"/>
                  <path class="spokes" d="M152 168 v40 M132 188 h40 M137.9 173.9 l28.2 28.2 M166.1 173.9 l-28.2 28.2"/>
                  <circle class="hub" cx="152" cy="188" r="6.5"/>
                </g>
              </g>
              <g class="wheel front right" id="wheel-fr">
                <circle class="tire" cx="348" cy="188" r="54"/>
                <circle class="sidewall" cx="348" cy="188" r="41"/>
                <path class="tire-mark front-mark" d="M318 166 q14 12 10 28 q22 -4 32 12"/>
                <g class="spin">
                  <circle class="rim front-rim" cx="348" cy="188" r="22"/>
                  <path class="spokes" d="M348 168 v40 M328 188 h40 M333.9 173.9 l28.2 28.2 M362.1 173.9 l-28.2 28.2"/>
                  <circle class="hub" cx="348" cy="188" r="6.5"/>
                </g>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <section class="play" aria-label="Choices">
      <p id="prompt" class="sr-only"></p>
      <div class="choices" id="choices"></div>
    </section>

    <div id="start" class="overlay">
      <p class="eyebrow">Listen, then tap</p>
      <h1>Monster Truck</h1>
      <p class="blurb">A letter or number is spoken. Tap the one you hear. A miss knocks off a wheel.</p>
      <button type="button" id="startBtn" class="overlay-btn">Tap to start</button>
    </div>

    <div id="gameover" class="overlay" hidden>
      <p class="eyebrow">The truck can't roll</p>
      <h2>Out of wheels</h2>
      <p class="blurb">Score <strong id="finalScore">0</strong></p>
      <button type="button" id="again" class="overlay-btn">Play again</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
